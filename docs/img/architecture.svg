<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">agent-teams architecture</title>
  <desc id="d">The user gives a task to the orchestrator, which starts parallel teammates in phase 1, then an opus reviewer in phase 2. Results return to the orchestrator for merge, verify and fix, and the result goes back to the user.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#264653"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fbf8f3"/>

  <!-- phase bands -->
  <rect x="490" y="62" width="250" height="290" rx="14" fill="#264653" fill-opacity="0.06" stroke="#264653" stroke-opacity="0.35" stroke-dasharray="6 5"/>
  <text x="615" y="88" font-size="14" font-weight="700" fill="#264653" text-anchor="middle" letter-spacing="1">PHASE 1 · PARALLEL</text>
  <rect x="770" y="62" width="210" height="290" rx="14" fill="#264653" fill-opacity="0.06" stroke="#264653" stroke-opacity="0.35" stroke-dasharray="6 5"/>
  <text x="875" y="88" font-size="14" font-weight="700" fill="#264653" text-anchor="middle" letter-spacing="1">PHASE 2 · REVIEW</text>

  <!-- user -->
  <rect x="30" y="150" width="120" height="80" rx="12" fill="#fbf8f3" stroke="#264653" stroke-width="2.5"/>
  <text x="90" y="186" font-size="18" font-weight="700" fill="#264653" text-anchor="middle">You</text>
  <text x="90" y="208" font-size="14" fill="#264653" text-anchor="middle">task in</text>

  <!-- orchestrator top -->
  <rect x="200" y="120" width="230" height="140" rx="14" fill="#264653"/>
  <text x="315" y="156" font-size="20" font-weight="700" fill="#fbf8f3" text-anchor="middle">Orchestrator</text>
  <text x="315" y="182" font-size="14" fill="#fbf8f3" text-anchor="middle">your session · current model</text>
  <text x="315" y="216" font-size="14" fill="#fbf8f3" text-anchor="middle" opacity="0.85">plan team · pick models</text>
  <text x="315" y="236" font-size="14" fill="#fbf8f3" text-anchor="middle" opacity="0.85">spawn · collect</text>

  <!-- members phase 1 -->
  <rect x="510" y="106" width="210" height="76" rx="12" fill="#2a9d8f"/>
  <text x="615" y="138" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">research · haiku</text>
  <text x="615" y="162" font-size="14" fill="#fff" text-anchor="middle">scan files, gather facts</text>
  <rect x="510" y="197" width="210" height="76" rx="12" fill="#e76f51"/>
  <text x="615" y="229" font-size="17" font-weight="700" fill="#1f1f1f" text-anchor="middle">build · sonnet</text>
  <text x="615" y="253" font-size="14" fill="#1f1f1f" text-anchor="middle">write code, docs, assets</text>
  <rect x="510" y="288" width="210" height="44" rx="12" fill="none" stroke="#264653" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="615" y="316" font-size="14" fill="#264653" text-anchor="middle">+ more, as the task needs</text>

  <!-- review -->
  <rect x="795" y="177" width="160" height="116" rx="12" fill="#6d597a"/>
  <text x="875" y="214" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">review · opus</text>
  <text x="875" y="240" font-size="14" fill="#fff" text-anchor="middle">independent check</text>
  <text x="875" y="260" font-size="14" fill="#fff" text-anchor="middle">of every result</text>

  <!-- orchestrator bottom -->
  <rect x="200" y="395" width="230" height="90" rx="14" fill="#264653"/>
  <text x="315" y="431" font-size="20" font-weight="700" fill="#fbf8f3" text-anchor="middle">Orchestrator</text>
  <text x="315" y="458" font-size="14" fill="#fbf8f3" text-anchor="middle">merge · verify · fix</text>

  <!-- result -->
  <rect x="30" y="410" width="120" height="60" rx="12" fill="#fbf8f3" stroke="#264653" stroke-width="2.5"/>
  <text x="90" y="436" font-size="18" font-weight="700" fill="#264653" text-anchor="middle">Result</text>
  <text x="90" y="457" font-size="14" fill="#264653" text-anchor="middle">to you</text>

  <!-- arrows -->
  <g fill="none" stroke="#264653" stroke-width="2.5" marker-end="url(#ar)">
    <path d="M150 190 H196"/>
    <path d="M430 175 C 465 175, 470 144, 506 144"/>
    <path d="M430 205 C 465 205, 470 235, 506 235"/>
    <path d="M430 225 C 460 225, 460 310, 506 310" stroke-dasharray="6 5" stroke-opacity="0.6"/>
    <path d="M720 144 C 760 144, 760 215, 791 215"/>
    <path d="M720 235 H791"/>
    <path d="M875 293 V440 H434"/>
    <path d="M200 440 H154"/>
  </g>
  <path d="M315 262 V393" fill="none" stroke="#264653" stroke-width="2" stroke-dasharray="3 5" stroke-opacity="0.7"/>
  <text x="327" y="332" font-size="14" fill="#264653">same session</text>
  <text x="655" y="428" font-size="14" fill="#264653" text-anchor="middle">results + findings</text>

  <!-- legend -->
  <line x1="30" y1="505" x2="970" y2="505" stroke="#264653" stroke-opacity="0.2"/>
  <text x="30" y="535" font-size="14" font-weight="700" fill="#264653">Model per teammate</text>
  <rect x="240" y="521" width="22" height="22" rx="5" fill="#2a9d8f"/>
  <text x="272" y="537" font-size="14" fill="#264653">haiku · fast, cheap</text>
  <rect x="460" y="521" width="22" height="22" rx="5" fill="#e76f51"/>
  <text x="492" y="537" font-size="14" fill="#264653">sonnet · balanced</text>
  <rect x="680" y="521" width="22" height="22" rx="5" fill="#6d597a"/>
  <text x="712" y="537" font-size="14" fill="#264653">opus · deepest</text>
</svg>
